minimum_pre_commit_version: '4.3.0'
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: zhajinhua-static
        name: Zhajinhua animation complexity
        entry: npm run check:zhajinhua
        language: system
        files: '^ios/full/zhajinhua-(?:accurate-bet|bet-region|card-region|operation-region|showdown|region-geometry|image-fixture).*\.(?:[cm]?[jt]sx?)$|^quality/zhajinhua-complexity.*\.(?:[cm]?[jt]sx?)$|^scripts/(?:check-zhajinhua-complexity|zhajinhua-complexity-scope)\.mjs$|^(?:eslint\.config\.mjs|package(?:-lock)?\.json|\.pre-commit-config\.yaml)$|^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
        require_serial: true
      - id: typecheck
        name: TypeScript typecheck
        entry: npm run typecheck
        language: system
        files: '\.(?:[cm]?[jt]sx?|json)$|^\.pre-commit-config\.yaml$|^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
        require_serial: true
      - id: python-static
        name: Python syntax (read only)
        entry: npm run check:python:static
        language: system
        files: '\.py$|^(?:package(?:-lock)?\.json|requirements-dev\.txt|\.pre-commit-config\.yaml)$|(?:^|/)requirements[^/]*\.txt$|^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
        require_serial: true
      - id: texas-animation-complexity
        name: Texas animation complexity (tests 3, tools 6)
        entry: npm run check:texas-animation
        language: system
        files: '^ios/full/texas-(?:action-region|action-start|card-region|control-variants|hall|panel-variants|panels|raise-masks|raise-region|record-variants|showdown-region|table-variants|animation).*\.[cm]?[jt]sx?$|^(?:eslint\.config\.mjs|quality/texas-animation.*|scripts/(?:check|measure)-texas-animation\.mjs|package(?:-lock)?\.json|\.pre-commit-config\.yaml|\.github/workflows/.*\.ya?ml)$'
        pass_filenames: false
        require_serial: true
