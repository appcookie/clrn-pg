# 直接消费公开 Release 模拟器包，执行游客页面截图和动画回归。
name: iOS Staging 模拟器回归

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      filter:
        description: 页面名称正则；留空运行全部首批页面
        type: string
        default: ''
      mode:
        description: 视觉模式（reference 生成待审查基准，compare 比较已提交基准）
        type: choice
        options: [smoke, reference, compare]
        default: smoke

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: 核对公开 iOS Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ios/download-release.mjs --simulator

  simulator:
    needs: check
    runs-on: macos-15
    timeout-minutes: 35
    env:
      APPIUM_HOME: ${{ github.workspace }}/.appium
      IOS_VISUAL_MODE: ${{ inputs.mode || 'smoke' }}
      IOS_FILTER: ${{ inputs.filter || '' }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 下载并校验模拟器包
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ios/download-release.mjs --simulator
      - name: 安装截图和录屏依赖
        run: |
          npx appium driver install xcuitest@12.19.1
          brew install ffmpeg
      - name: 创建固定型号和系统的专用模拟器
        run: |
          xcrun simctl list runtimes
          udid=$(xcrun simctl create clrn-visual com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: 运行游客页面与动画测试
        run: npm run test:ios
      - name: 保存截图、动画、页面层级和构建身份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            ios/artifacts/results/
            ios/artifacts/release/build-info.json
            ios/snapshots/
      - name: 删除专用模拟器
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: xcrun simctl delete "$IOS_SIMULATOR_UDID"
