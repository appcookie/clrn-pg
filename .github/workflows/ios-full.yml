# 保留逻辑分组，在 App、德州、拼三张三个 runner 内顺序执行。
name: iOS 完整回归
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      group:
        description: pr 为游客截图及未隔离录屏；quarantined 手动重跑隔离组；animations 为完整动画诊断
        type: choice
        default: pr
        options: [pr, quarantined, animations, all, guest, account, social, rooms, wallet-help, records, texas, zhajinhua, functional, functional-creation, interaction, network]
      locale:
        description: 视觉语言；功能组固定 en
        type: choice
        default: all
        options: [all, en, zh-Hans, zh-Hant]
      mode:
        description: 视觉基准模式
        type: choice
        default: compare
        options: [smoke, reference, compare]
      functional_case:
        description: 手动功能组定向用例；PR 门禁仍执行原有完整范围
        type: choice
        default: all
        options: [all, club-search-results]
      room_case:
        description: 手动 rooms 组定向执行三语言德州、短牌高级设置；不缩减 PR 门禁
        type: choice
        default: all
        options: [all, rtc-retirement]
      animation_case:
        description: 手动可填 animation-编号；隔离组 20 可填 animation-20/themes、voice_records 或 interactions
        type: string
        default: ''
permissions:
  contents: read
env:
  # 为依赖下载预留更长的有限重试窗口，避免短暂域名解析故障中断回归。
  PIP_RETRIES: '10'
jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    outputs:
      matrix: ${{ steps.bundle.outputs.matrix }}
      run_native: ${{ steps.bundle.outputs.run_native }}
      preflight: ${{ steps.preflight.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 提交前静态检查（与本地共用配置）
        if: inputs.room_case != 'rtc-retirement'
        run: |
          python -m venv .venv-pre-commit
          .venv-pre-commit/bin/python -m pip install -r requirements-dev.txt
          .venv-pre-commit/bin/pre-commit run --all-files
          .venv-pre-commit/bin/python scripts/test-pre-commit.py
      - if: inputs.room_case != 'rtc-retirement'
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/python -m pip install -r e2e/mitmproxy/requirements.txt
      - if: inputs.room_case != 'rtc-retirement'
        run: npm run check
      - if: inputs.room_case != 'rtc-retirement'
        run: npm run check:python
      - name: 高级设置相关检查（仅手动定向回归）
        if: github.event_name == 'workflow_dispatch' && inputs.group == 'rooms' && inputs.room_case == 'rtc-retirement'
        run: |
          npm run typecheck
          node --import tsx --test ios/full/room-advanced.test.mjs scripts/room-advanced-plan.test.mjs
          node --import tsx --test --test-name-pattern '会恢复默认值的房名|先聚焦再清空受控输入' ios/full/native-device.test.mjs
          node --import tsx --test ios/full/native-viewport.test.mjs
          cd ios/full
          python -m unittest test_game_session.GameSessionTests.test_room_presentation_preserves_real_identity_and_only_changes_own_number
      - id: plan
        env:
          CI_IOS_GROUP: ${{ inputs.group }}
          CI_IOS_LOCALE: ${{ inputs.locale || 'all' }}
          CI_ANIMATION_CASE: ${{ inputs.animation_case }}
          CI_FUNCTIONAL_CASE: ${{ inputs.functional_case || 'all' }}
          CI_ROOM_CASE: ${{ inputs.room_case || 'all' }}
          CLRN_IOS_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_IOS_CI_TEST_ACCOUNTS }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: |
          if [ -z "$CI_IOS_GROUP" ]; then
            export CI_IOS_GROUP=pr
            echo 'PR 和 master push 比较三语言游客及未隔离牌局静态截图，采集未隔离组录屏；隔离清单见 ios/full/quarantined/。' >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/plan-ci-accounts.mjs ios
      - name: compare 基准预检
        id: preflight
        if: inputs.mode == 'compare' || github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          IOS_CI_MATRIX: ${{ steps.plan.outputs.matrix }}
        run: node ios/full/baseline-preflight.mjs
      - name: 选择完整比较或缺基准的诊断采集
        id: select
        env:
          IOS_CI_MATRIX: ${{ steps.plan.outputs.matrix }}
          IOS_BASELINE_PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome == 'skipped' && 'success' || steps.preflight.outcome }}
          IOS_REFERENCE_CASES: ${{ steps.preflight.outputs.reference_cases }}
        run: node ios/full/select-ci-matrix.mjs
      - name: 核对公开 iOS Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ios/download-release.mjs --simulator
      - name: 合并逻辑分组为三个业务 runner
        id: bundle
        env:
          IOS_CI_MATRIX: ${{ steps.select.outputs.matrix }}
          IOS_INCLUDE_STAGING: ${{ github.event_name != 'workflow_dispatch' }}
          CLRN_IOS_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_IOS_CI_TEST_ACCOUNTS }}
        run: node scripts/ios-ci-plan.mjs
  # Preserve existing required check contexts; expensive checks run only in plan.
  proxy-check:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.plan.result }}
        run: test "$RESULT" = success
  check:
    name: ${{ github.event_name == 'workflow_dispatch' && 'iOS diagnostic checks' || 'check' }}
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.plan.result }}
        run: test "$RESULT" = success
  native:
    needs: [plan, proxy-check]
    if: needs.plan.outputs.run_native == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: ios-account-${{ matrix.account || format('{0}-{1}-{2}', github.run_id, matrix.business, github.run_attempt) }}
      queue: max
    runs-on: macos-15
    timeout-minutes: ${{ matrix.timeout }}
    name: ${{ matrix.label }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      APPIUM_HOME: ${{ github.workspace }}/.appium
      IOS_SIMULATOR_UDID: ''
      IOS_VISUAL_MODE: ${{ inputs.mode || 'compare' }}
      CLRN_IOS_ACCOUNT_LOCK: ${{ matrix.account }}
      IOS_BUSINESS_PLAN: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: 下载公开模拟器包并安装测试工具
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ios/download-release.mjs --simulator
          npx appium driver install xcuitest@12.19.1
          brew install ffmpeg
          python -m venv e2e/.venv
          e2e/.venv/bin/python -m pip install -r e2e/mitmproxy/requirements.txt
      - name: 创建专用模拟器
        run: |
          udid=$(xcrun simctl create clrn-full com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: 顺序执行全部逻辑分组，失败后清理并继续
        id: native_test
        env:
          CLRN_IOS_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_IOS_CI_TEST_ACCOUNTS }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: node scripts/run-ios-business.mjs
      - name: 恢复 runner 代理设置
        if: always()
        run: node ios/full/system-proxy.mjs restore
      - name: 保存各组报告、截图、录像、构建身份及候选
        if: always()
        id: test_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-business-${{ matrix.business }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ios/artifacts/business/
            ios/artifacts/full-results/
            ios/artifacts/full-report/
            ios/artifacts/results/
            ios/artifacts/release/build-info.json
            ${{ inputs.room_case == 'rtc-retirement' && '!ios/artifacts/business/**/reference-candidates/**' || '' }}
      - name: 保存分组状态和失败摘要供总门禁汇总
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-result-${{ matrix.business }}-${{ github.run_id }}
          overwrite: true
          retention-days: 30
          if-no-files-found: error
          path: |
            ios/artifacts/business/${{ matrix.business }}/results.json
            ios/artifacts/business/${{ matrix.business }}/summary.md
      - name: 分组证据入口
        if: always() && steps.test_artifacts.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.test_artifacts.outputs.artifact-url }}
        run: echo "[下载本业务全部分组证据]($ARTIFACT_URL)，解压后按分组打开 index.html 或报告。" >> "$GITHUB_STEP_SUMMARY"
      - name: 删除专用模拟器
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: xcrun simctl delete "$IOS_SIMULATOR_UDID"
  simulator:
    name: ${{ github.event_name == 'workflow_dispatch' && 'iOS Staging diagnostics' || 'simulator' }}
    # The old Staging required context now reflects the merged App execution.
    needs: [plan, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          PREFLIGHT: ${{ needs.plan.outputs.preflight == 'skipped' && github.event_name == 'workflow_dispatch' && 'success' || needs.plan.outputs.preflight }}
          NATIVE: ${{ needs.native.result }}
        run: test "$PLAN" = success && test "$PREFLIGHT" = success && test "$NATIVE" = success
  screenshot-video-gate:
    # GitHub treats skipped checks as successful. Manual diagnostics must never
    # publish the same check context as the required PR/master aggregate.
    name: ${{ github.event_name == 'workflow_dispatch' && 'iOS recording diagnostics' || 'iOS screenshot and video gate' }}
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [plan, proxy-check, native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: 汇集失败分片的简短摘要
        if: needs.plan.outputs.run_native == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ios-ci-result-*-${{ github.run_id }}
          path: ci-failures
      - name: 核对全部必须执行的分组结果
        if: needs.plan.outputs.run_native == 'true'
        env:
          IOS_BUSINESS_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: node scripts/verify-ios-business.mjs
      - name: 记录三个业务 job 的排队、初始化、测试和总耗时
        if: always() && needs.plan.outputs.run_native == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ios-ci-timing.mjs
      - name: 显示失败原因和证据入口
        if: needs.plan.result != 'success' || needs.plan.outputs.preflight != 'success' || needs.proxy-check.result != 'success' || needs.native.result != 'success'
        env:
          CI_PLAN: ${{ needs.plan.result }}
          CI_PREFLIGHT: ${{ needs.plan.outputs.preflight }}
          CI_PROXY: ${{ needs.proxy-check.result }}
          CI_NATIVE: ${{ needs.native.result }}
        run: node ios/full/ci-failure-summary.mjs gate
      - name: 所有截图与录屏分片必须成功；取消、跳过和缺基准均阻断
        env:
          PLAN: ${{ needs.plan.result }}
          PREFLIGHT: ${{ needs.plan.outputs.preflight }}
          PROXY: ${{ needs.proxy-check.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$PLAN" = success && test "$PREFLIGHT" = success && test "$PROXY" = success && test "$NATIVE" = success
