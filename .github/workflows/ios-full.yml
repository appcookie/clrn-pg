# 完整原生测试按业务组隔离；游客无需凭据，完整矩阵使用独立 iOS 测试账号。
name: iOS 完整回归
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      group:
        description: pr 为游客截图及未隔离录屏；quarantined 手动重跑隔离组；animations 为完整动画诊断
        type: choice
        default: pr
        options: [pr, quarantined, animations, all, guest, account, social, rooms, wallet-help, records, texas, zhajinhua, functional, functional-creation, interaction, network]
      locale:
        description: 视觉语言；功能组固定 en
        type: choice
        default: all
        options: [all, en, zh-Hans, zh-Hant]
      mode:
        description: 视觉基准模式
        type: choice
        default: compare
        options: [smoke, reference, compare]
      functional_case:
        description: 手动功能组定向用例；PR 门禁仍执行原有完整范围
        type: choice
        default: all
        options: [all, club-search-results]
      animation_case:
        description: 手动可填 animation-编号；隔离组 20 可填 animation-20/themes、voice_records 或 interactions
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  # 为依赖下载预留更长的有限重试窗口，避免短暂域名解析故障中断回归。
  PIP_RETRIES: '10'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.schedule.outputs.priority }}
      remaining: ${{ steps.schedule.outputs.remaining }}
      has_priority: ${{ steps.schedule.outputs.has_priority }}
      has_remaining: ${{ steps.schedule.outputs.has_remaining }}
      run_native: ${{ steps.select.outputs.run_native }}
      preflight: ${{ steps.preflight.outcome }}
      artifact_name: ${{ steps.schedule.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        env:
          CI_IOS_GROUP: ${{ inputs.group }}
          CI_IOS_LOCALE: ${{ inputs.locale || 'all' }}
          CI_ANIMATION_CASE: ${{ inputs.animation_case }}
          CI_FUNCTIONAL_CASE: ${{ inputs.functional_case || 'all' }}
          CLRN_IOS_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_IOS_CI_TEST_ACCOUNTS }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: |
          if [ -z "$CI_IOS_GROUP" ]; then
            export CI_IOS_GROUP=pr
            echo 'PR 和 master push 比较三语言游客及未隔离牌局静态截图，采集未隔离组录屏；隔离清单见 ios/full/quarantined/。' >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/plan-ci-accounts.mjs ios
      - name: 安装基准预检依赖
        if: inputs.mode == 'compare' || github.event_name != 'workflow_dispatch'
        run: npm ci
      - name: compare 基准预检
        id: preflight
        if: inputs.mode == 'compare' || github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          IOS_CI_MATRIX: ${{ steps.plan.outputs.matrix }}
        run: node ios/full/baseline-preflight.mjs
      - name: 选择完整比较或缺基准的诊断采集
        id: select
        env:
          IOS_CI_MATRIX: ${{ steps.plan.outputs.matrix }}
          IOS_BASELINE_PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome == 'skipped' && 'success' || steps.preflight.outcome }}
          IOS_REFERENCE_CASES: ${{ steps.preflight.outputs.reference_cases }}
        run: node ios/full/select-ci-matrix.mjs
      - name: 读取同范围历史并划分两阶段
        id: schedule
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_CI_MATRIX: ${{ steps.select.outputs.matrix }}
          CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/plan-ci-schedule.mjs
      - name: 保存完整计划（优先失败时也保留剩余清单）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.schedule.outputs.artifact_name }}
          path: ios/artifacts/ci-schedule/plan.json
          if-no-files-found: error
          retention-days: 30

  proxy-check:
    runs-on: ubuntu-latest
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: 提交前静态检查（与本地共用配置）
        run: |
          python -m venv .venv-pre-commit
          .venv-pre-commit/bin/python -m pip install -r requirements-dev.txt
          .venv-pre-commit/bin/pre-commit run --all-files
          .venv-pre-commit/bin/python scripts/test-pre-commit.py
      - run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/python -m pip install -r e2e/mitmproxy/requirements.txt
      - run: npm run check:static
      - run: npm run check:python
  target-build:
    outputs:
      artifact_name: ios-target-build-${{ github.run_id }}-${{ github.run_attempt }}
    needs: [plan, proxy-check]
    if: needs.plan.outputs.run_native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 下载并校验两阶段共用的目标构建
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ios/download-release.mjs --simulator
      - name: 保存本轮不可变目标包及构建身份
        uses: actions/upload-artifact@v4
        with:
          name: ios-target-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios/artifacts/release/
          if-no-files-found: error
          retention-days: 30

  native-priority:
    needs: [plan, proxy-check, target-build]
    if: needs.plan.outputs.run_native == 'true' && needs.plan.outputs.has_priority == 'true'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.priority) }}
    concurrency:
      group: ios-account-${{ matrix.account || format('{0}-{1}-{2}-{3}', github.run_id, matrix.group, matrix.locale, matrix.shard) }}
      queue: max
    runs-on: macos-15
    timeout-minutes: ${{ matrix.animation == 'animation-20' && 135 || 120 }}
    name: ${{ matrix.label }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      APPIUM_HOME: ${{ github.workspace }}/.appium
      IOS_SIMULATOR_UDID: ''
      IOS_GROUP: ${{ matrix.group }}
      IOS_LOCALE: ${{ matrix.locale }}
      IOS_VISUAL_MODE: ${{ matrix.mode || inputs.mode || 'compare' }}
      IOS_ANIMATION_RECORD_ONLY: ${{ matrix.recordOnly && '1' || '0' }}
      CLRN_CI_ACCOUNT: ${{ matrix.account }}
      CLRN_IOS_ACCOUNT_LOCK: ${{ matrix.account }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-native
        with:
          entry: ${{ toJSON(matrix) }}
          build_artifact: ${{ needs.target-build.outputs.artifact_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLRN_IOS_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_IOS_CI_TEST_ACCOUNTS }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}

  native:
    needs: [plan, proxy-check, target-build, native-priority]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.proxy-check.result == 'success' && needs.target-build.result == 'success' && needs.plan.outputs.run_native == 'true' && needs.plan.outputs.has_remaining == 'true' && ((needs.plan.outputs.has_priority == 'true' && needs.native-priority.result == 'success') || (needs.plan.outputs.has_priority == 'false' && needs.native-priority.result == 'skipped'))
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.remaining) }}
    concurrency:
      group: ios-account-${{ matrix.account || format('{0}-{1}-{2}-{3}', github.run_id, matrix.group, matrix.locale, matrix.shard) }}
      queue: max
    runs-on: macos-15
    timeout-minutes: ${{ matrix.animation == 'animation-20' && 135 || 120 }}
    name: ${{ matrix.label }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      APPIUM_HOME: ${{ github.workspace }}/.appium
      IOS_SIMULATOR_UDID: ''
      IOS_GROUP: ${{ matrix.group }}
      IOS_LOCALE: ${{ matrix.locale }}
      IOS_VISUAL_MODE: ${{ matrix.mode || inputs.mode || 'compare' }}
      IOS_ANIMATION_RECORD_ONLY: ${{ matrix.recordOnly && '1' || '0' }}
      CLRN_CI_ACCOUNT: ${{ matrix.account }}
      CLRN_IOS_ACCOUNT_LOCK: ${{ matrix.account }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-native
        with:
          entry: ${{ toJSON(matrix) }}
          build_artifact: ${{ needs.target-build.outputs.artifact_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLRN_IOS_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_IOS_CI_TEST_ACCOUNTS }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}

  screenshot-video-gate:
    # GitHub treats skipped checks as successful. Manual diagnostics must never
    # publish the same check context as the required PR/master aggregate.
    name: ${{ github.event_name == 'workflow_dispatch' && 'iOS recording diagnostics' || 'iOS screenshot and video gate' }}
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [plan, proxy-check, target-build, native-priority, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 汇集失败分片的简短摘要
        if: (needs.plan.outputs.has_remaining == 'true' && needs.native.result != 'success') || (needs.plan.outputs.has_priority == 'true' && needs.native-priority.result != 'success')
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ios-ci-failure-*-${{ github.run_attempt }}
          path: ci-failures
      - name: 显示失败原因和证据入口
        if: needs.plan.result != 'success' || needs.plan.outputs.preflight != 'success' || needs.proxy-check.result != 'success' || needs.target-build.result != 'success' || (needs.plan.outputs.has_remaining == 'true' && needs.native.result != 'success') || (needs.plan.outputs.has_priority == 'true' && needs.native-priority.result != 'success')
        env:
          CI_PLAN: ${{ needs.plan.result }}
          CI_PREFLIGHT: ${{ needs.plan.outputs.preflight }}
          CI_PROXY: ${{ needs.proxy-check.result }}
          CI_NATIVE: ${{ (needs.plan.outputs.has_priority == 'true' && needs.native-priority.result != 'success' && needs.native-priority.result) || (needs.plan.outputs.has_remaining == 'true' && needs.native.result) || 'success' }}
        run: node ios/full/ci-failure-summary.mjs gate
      - name: 读取本轮完整计划
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ios/artifacts/ci-schedule/
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '24'
      - name: 所有截图与录屏分片必须成功；取消、跳过和缺基准均阻断
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCHEDULE_METRICS: 'true'
          CI_STAGE_RESULTS: >-
            {"plan":"${{ needs.plan.result }}","preflight":"${{ needs.plan.outputs.preflight }}",
            "proxy":"${{ needs.proxy-check.result }}","build":"${{ needs.target-build.result }}",
            "priority":"${{ needs.native-priority.result }}","remaining":"${{ needs.native.result }}"}
        run: node scripts/check-ci-schedule.mjs
